<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蛏子开壳监控系统 - 高端科技控制台</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 核心调整：body完全占满视口，无任何边距 */
        body {
            background: #0a0e17;
            background-image: linear-gradient(rgba(10, 14, 23, 0.98), rgba(10, 14, 23, 0.98));
            color: #ffffff;
            height: 100vh;
            width: 100vw; /* 强制占满宽度 */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            font-family: 'Roboto', sans-serif;
            position: relative;
            margin: 0 !important; /* 清除默认边距 */
            padding: 0 !important;
        }

        /* 顶部导航：紧凑布局，占满宽度，高度适配 */
        .header {
            background: linear-gradient(90deg, #121928 0%, #0f172a 100%);
            height: 60px; /* 降低高度，让主内容区更多 */
            width: 100%; /* 强制占满宽度 */
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px; /* 减少内边距 */
            border-bottom: 1px solid rgba(22, 93, 255, 0.2);
            position: relative;
            z-index: 10;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            flex-shrink: 0; /* 防止被压缩 */
        }

        .header::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                90deg,
                rgba(255, 255, 255, 0.01) 0px,
                rgba(255, 255, 255, 0.01) 1px,
                transparent 1px,
                transparent 20px
            );
            pointer-events: none;
            opacity: 0.5;
        }

        .header::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #36CFC9, #165DFF);
            background-size: 200% auto;
            animation: gradientFlow 4s ease infinite;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .page-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 600;
            color: #e2e8f0;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 3px rgba(0, 0, 0, 0.3);
        }

        .page-title i {
            font-size: 24px;
            color: #36CFC9;
        }

        .status-panel {
            display: flex;
            gap: 20px;
        }

        .status-box {
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            z-index: 1;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #F53F3F;
            box-shadow: 0 0 4px rgba(245, 63, 63, 0.5);
            transition: all 0.5s ease;
            animation: pulseRed 2s infinite;
        }

        .status-indicator.connected {
            background-color: #36CFC9;
            box-shadow: 0 0 4px rgba(54, 207, 201, 0.5);
            animation: pulseCyan 2s infinite;
        }

        @keyframes pulseRed {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        @keyframes pulseCyan {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .status-text {
            font-size: 13px;
            color: #C9CDD4;
        }

        .status-value {
            font-family: 'Orbitron', sans-serif;
            color: #94a3b8;
            font-weight: 500;
        }

        /* 核心调整：主容器完全占满剩余空间，无内边距 */
        .main-container {
            flex: 1; /* 占满header外的所有空间 */
            width: 100%; /* 强制占满宽度 */
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px; /* 最小化间隙 */
            padding: 10px; /* 仅保留极小内边距 */
            position: relative;
            z-index: 1;
            overflow: hidden; /* 防止溢出 */
        }

        /* 模块卡片：完全占满网格单元格 */
        .module-card {
            background: rgba(18, 25, 40, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(22, 93, 255, 0.15);
            border-radius: 8px;
            padding: 15px; /* 减少内边距 */
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 100%; /* 强制占满宽度 */
            height: 100%; /* 强制占满高度 */
        }

        .module-card::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(180deg, #36CFC9, #165DFF);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .module-card:hover {
            border-color: rgba(22, 93, 255, 0.3);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

        .module-card:hover::after {
            opacity: 1;
        }

        .module-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: #e2e8f0;
            margin-bottom: 10px; /* 减少间距 */
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            z-index: 1;
            flex-shrink: 0; /* 防止标题被压缩 */
        }

        .module-title i {
            color: #165DFF;
            font-size: 16px;
        }

        /* 1. 监控模块：完全占满 */
        .monitor-module {
            grid-column: 1 / 2;
            grid-row: 1 / 2;
        }

        .monitor-screen {
            flex: 1; /* 占满模块内剩余空间 */
            background: rgba(10, 14, 23, 0.8);
            border: 1px solid rgba(22, 93, 255, 0.15);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.3);
            width: 100%;
            height: 100%;
        }

        #camera-stream {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s ease;
            filter: contrast(1.05) brightness(1.02);
        }

        .monitor-placeholder {
            color: #475467;
            font-size: 14px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            height: 100%;
        }

        .monitor-placeholder i {
            font-size: 42px;
            margin-bottom: 8px;
            color: rgba(22, 93, 255, 0.15);
        }

        /* 2. 控制模块：完全占满 */
        .control-module {
            grid-column: 1 / 2;
            grid-row: 2 / 3;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly; /* 均匀分布按钮 */
            gap: 10px;
        }

        .control-btn {
            width: 100%;
            height: 45px; /* 适配高度 */
            border: none;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
        }

        .control-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }

        .control-btn:hover:not(:disabled)::before {
            transform: translateX(100%);
        }

        .control-btn:disabled {
            background: rgba(30, 41, 59, 0.5) !important;
            color: #667085 !important;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            opacity: 0.7;
        }

        .connect-btn {
            background: linear-gradient(135deg, #165DFF, #0E42D2);
        }

        .connect-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #256BFF, #154ED5);
            box-shadow: 0 4px 12px rgba(22, 93, 255, 0.2);
            transform: translateY(-1px);
        }

        .start-btn {
            background: linear-gradient(135deg, #36CFC9, #28B4B0);
            color: #0A0E17 !important;
        }

        .start-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #4ADBC8, #32C0BC);
            box-shadow: 0 4px 12px rgba(54, 207, 201, 0.2);
            transform: translateY(-1px);
        }

        .stop-btn {
            background: linear-gradient(135deg, #F53F3F, #D92D20);
        }

        .stop-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #FF5252, #E53935);
            box-shadow: 0 4px 12px rgba(245, 63, 63, 0.2);
            transform: translateY(-1px);
        }

        .control-btn i {
            font-size: 16px;
        }

        /* 3. 数据仪表盘 + 运行时间模块：完全占满 */
        .dashboard-module {
            grid-column: 2 / 3;
            grid-row: 1 / 2;
        }

        .dashboard-grid {
            flex: 1; /* 占满模块内剩余空间 */
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr; /* 单行 */
            gap: 10px;
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
        }

        .data-gauge {
            background: rgba(10, 14, 23, 0.8);
            border: 1px solid rgba(22, 93, 255, 0.15);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.2);
            width: 100%;
            height: 100%;
        }

        .data-gauge:hover {
            border-color: rgba(22, 93, 255, 0.25);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.2), 0 0 8px rgba(22, 93, 255, 0.08);
        }

        .gauge-label {
            font-size: 13px;
            color: #94A3B8;
            margin-bottom: 8px;
            text-align: center;
        }

        .gauge-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 42px; /* 放大数字，填充空间 */
            font-weight: 600;
            color: #e2e8f0;
            line-height: 1;
            transition: all 0.3s ease;
        }

        .gauge-unit {
            font-size: 12px;
            color: #94A3B8;
            margin-top: 6px;
        }

        /* 开机运行时间模块：完全占满单元格 */
        .runtime-gauge {
            background: rgba(10, 14, 23, 0.8);
            border: 1px solid rgba(22, 93, 255, 0.15);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.2);
            width: 100%;
            height: 100%;
        }

        .circle-container {
            position: relative;
            width: 120px; /* 放大环形，填充空间 */
            height: 120px;
            margin-bottom: 8px;
        }

        .circle-bg {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid rgba(22, 93, 255, 0.1);
            position: absolute;
            top: 0;
            left: 0;
        }

        .circle-progress {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top-color: #165DFF;
            border-right-color: #36CFC9;
            position: absolute;
            top: 0;
            left: 0;
            animation: circleRotate 4s linear infinite;
            transform-origin: center;
        }

        @keyframes circleRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .runtime-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Orbitron', sans-serif;
            font-size: 18px; /* 放大时间文字 */
            color: #e2e8f0;
            text-align: center;
            width: 100px;
        }

        /* 4. 趋势图表模块：完全占满 */
        .chart-module {
            grid-column: 2 / 3;
            grid-row: 2 / 3;
        }

        .chart-container {
            flex: 1; /* 占满模块内剩余空间 */
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 23, 0.8);
            border: 1px solid rgba(22, 93, 255, 0.15);
            border-radius: 6px;
            padding: 10px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        /* 响应式适配：移动端也完全占满 */
        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
                grid-template-rows: 2fr 1fr 1fr 2fr; /* 调整行高比例，确保占满 */
                padding: 8px;
                gap: 8px;
            }
            .monitor-module, .control-module, .dashboard-module, .chart-module {
                grid-column: 1 / 2;
                width: 100%;
                height: 100%;
            }
            .monitor-module { grid-row: 1 / 2; }
            .dashboard-module { grid-row: 2 / 3; }
            .control-module { grid-row: 3 / 4; }
            .chart-module { grid-row: 4 / 5; }
            
            .gauge-value {
                font-size: 32px;
            }
            
            .circle-container {
                width: 90px;
                height: 90px;
            }
            
            .runtime-value {
                font-size: 16px;
            }
            
            .control-btn {
                height: 40px;
                font-size: 13px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="header">
        <h1 class="page-title">
            <i class="fa-solid fa-industry"></i>
            蛏子开壳监控系统
        </h1>
        <div class="status-panel">
            <div class="status-box">
                <div id="bleIndicator" class="status-indicator"></div>
                <div class="status-text">蓝牙状态: <span id="bleStatus" class="status-value">未连接</span></div>
            </div>
            <div class="status-box">
                <div class="status-text">更新时间: <span id="updateTime" class="status-value">--:--:--</span></div>
            </div>
        </div>
    </div>

    <div class="main-container">
        <!-- 监控模块 -->
        <div class="module-card monitor-module">
            <h2 class="module-title">
                <i class="fa-solid fa-video"></i>
                实时监控画面
            </h2>
            <div class="monitor-screen">
                <img id="camera-stream" src="http://192.168.211.73:81/stream" alt="监控画面" style="display: none;">
                <div id="monitorPlaceholder" class="monitor-placeholder">
                    <i class="fa-solid fa-camera"></i>
                    <p>摄像头未连接<br>请检查ESP32网络地址</p>
                </div>
            </div>
        </div>

        <!-- 控制模块 -->
        <div class="module-card control-module">
            <h2 class="module-title">
                <i class="fa-solid fa-toggle-on"></i>
                设备控制中心
            </h2>
            <button id="connectBtn" class="control-btn connect-btn" onclick="connectBluetooth()">
                <i class="fa-solid fa-bluetooth-b"></i> 连接蓝牙模块
            </button>
            <button id="startBtn" class="control-btn start-btn" onclick="send('1')" disabled>
                <i class="fa-solid fa-play"></i> 启动开壳作业
            </button>
            <button id="stopBtn" class="control-btn stop-btn" onclick="send('2')" disabled>
                <i class="fa-solid fa-stop"></i> 停止开壳作业
            </button>
        </div>

        <!-- 数据仪表盘 + 运行时间模块 -->
        <div class="module-card dashboard-module">
            <h2 class="module-title">
                <i class="fa-solid fa-gauge-high"></i>
                核心运行数据
            </h2>
            <div class="dashboard-grid">
                <div class="data-gauge">
                    <div class="gauge-label">累计开壳数</div>
                    <div id="totalCount" class="gauge-value">0</div>
                    <div class="gauge-unit">个</div>
                </div>
                <!-- 开机运行时间 -->
                <div class="runtime-gauge">
                    <div class="gauge-label">开机运行时间</div>
                    <div class="circle-container">
                        <div class="circle-bg"></div>
                        <div class="circle-progress"></div>
                        <div id="runtimeValue" class="runtime-value">00:00:00</div>
                    </div>
                    <div class="gauge-unit">时:分:秒</div>
                </div>
                <div class="data-gauge" style="grid-column: 1 / 3; margin-top: 10px;">
                    <div class="gauge-label">开壳成功率</div>
                    <div id="successRate" class="gauge-value">0</div>
                    <div class="gauge-unit">%</div>
                </div>
            </div>
        </div>

        <!-- 趋势图表模块 -->
        <div class="module-card chart-module">
            <h2 class="module-title">
                <i class="fa-solid fa-chart-line"></i>
                数据趋势分析
            </h2>
            <div id="dynamicChart" class="chart-container"></div>
        </div>
    </div>

    <script>
        // 开机运行时间计时
        function startRuntimeTimer() {
            const startTime = new Date().getTime();
            const runtimeElement = document.getElementById('runtimeValue');
            
            function updateRuntime() {
                const currentTime = new Date().getTime();
                const elapsed = Math.floor((currentTime - startTime) / 1000);
                
                const hours = Math.floor(elapsed / 3600).toString().padStart(2, '0');
                const minutes = Math.floor((elapsed % 3600) / 60).toString().padStart(2, '0');
                const seconds = (elapsed % 60).toString().padStart(2, '0');
                
                runtimeElement.textContent = `${hours}:${minutes}:${seconds}`;
            }
            
            updateRuntime();
            setInterval(updateRuntime, 1000);
        }
        
        window.addEventListener('load', startRuntimeTimer);

        // 蓝牙配置
        const MODULE_NAME = "HC-04";
        const SERVICE_UUID = "0000ffe0-0000-1000-8000-00805f9b34fb";
        const CHAR_UUID = "0000ffe1-0000-1000-8000-00805f9b34fb";
        
        let bleCharacteristic = null;
        let bleDevice = null;

        // 摄像头加载检测
        const cameraStream = document.getElementById('camera-stream');
        const monitorPlaceholder = document.getElementById('monitorPlaceholder');
        cameraStream.onload = function() {
            monitorPlaceholder.style.display = 'none';
            cameraStream.style.display = 'block';
        }
        cameraStream.onerror = function() {
            monitorPlaceholder.style.display = 'flex';
            cameraStream.style.display = 'none';
        }

        // 图表初始化
        const chart = echarts.init(document.getElementById('dynamicChart'));
        const chartData = {
            time: [],
            count: [],
            rate: [],
            maxLen: 12
        };

        const chartOption = {
            backgroundColor: 'transparent',
            textStyle: { color: '#C9CDD4', fontSize: 11 },
            grid: { left: '8%', right: '5%', top: '10%', bottom: '15%' },
            legend: {
                data: ['开壳数', '开壳率'],
                textStyle: { color: '#94A3B8' },
                bottom: 0
            },
            xAxis: {
                type: 'category',
                data: chartData.time,
                axisLine: { lineStyle: { color: 'rgba(22, 93, 255, 0.2)' } },
                axisLabel: { color: '#94A3B8', fontSize: 10 }
            },
            yAxis: [
                {
                    type: 'value',
                    name: '开壳数',
                    nameTextStyle: { color: '#36CFC9' },
                    axisLine: { lineStyle: { color: 'rgba(22, 93, 255, 0.2)' } },
                    axisLabel: { color: '#94A3B8' },
                    splitLine: { lineStyle: { color: 'rgba(22, 93, 255, 0.08)', type: 'dashed' } }
                },
                {
                    type: 'value',
                    name: '开壳率(%)',
                    nameTextStyle: { color: '#165DFF' },
                    max: 100,
                    axisLine: { lineStyle: { color: 'rgba(22, 93, 255, 0.2)' } },
                    axisLabel: { color: '#94A3B8' },
                    splitLine: { show: false }
                }
            ],
            series: [
                {
                    name: '开壳数',
                    type: 'line',
                    yAxisIndex: 0,
                    data: chartData.count,
                    symbol: 'circle',
                    symbolSize: 5,
                    lineStyle: { color: '#36CFC9', width: 2 },
                    itemStyle: { color: '#36CFC9', borderColor: '#ffffff', borderWidth: 1 },
                    areaStyle: { 
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: 'rgba(54, 207, 201, 0.15)' },
                            { offset: 1, color: 'rgba(54, 207, 201, 0.02)' }
                        ])
                    },
                    animation: true,
                    animationDuration: 800,
                    animationEasing: 'cubicOut'
                },
                {
                    name: '开壳率',
                    type: 'line',
                    yAxisIndex: 1,
                    data: chartData.rate,
                    symbol: 'circle',
                    symbolSize: 5,
                    lineStyle: { color: '#165DFF', width: 2 },
                    itemStyle: { color: '#165DFF', borderColor: '#ffffff', borderWidth: 1 },
                    areaStyle: { 
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: 'rgba(22, 93, 255, 0.15)' },
                            { offset: 1, color: 'rgba(22, 93, 255, 0.02)' }
                        ])
                    },
                    animation: true,
                    animationDuration: 800,
                    animationEasing: 'cubicOut'
                }
            ]
        };
        chart.setOption(chartOption);
        window.addEventListener('resize', () => {
            chart.resize();
            // 窗口大小变化时强制重绘，确保占满
            document.querySelector('.main-container').style.height = `${window.innerHeight - 60}px`;
        });

        // 初始化时强制设置主容器高度
        window.addEventListener('load', () => {
            document.querySelector('.main-container').style.height = `${window.innerHeight - 60}px`;
        });

        // 数字跳动动画
        function pulseNumber(elementId, targetValue, isRate = false) {
            const element = document.getElementById(elementId);
            const duration = 600;
            const stepTime = 50;
            const startValue = parseInt(element.textContent) || 0;
            const steps = duration / stepTime;
            const step = (targetValue - startValue) / steps;
            let currentStep = 0;

            const timer = setInterval(() => {
                currentStep++;
                const value = Math.round(startValue + step * currentStep);
                element.textContent = isRate ? value + '%' : value;
                if (currentStep >= steps) {
                    clearInterval(timer);
                    element.textContent = isRate ? targetValue.toFixed(0) + '%' : targetValue.toFixed(0);
                }
            }, stepTime);
        }

        // 更新图表
        function updateChart(count, rate) {
            const now = new Date();
            const timeStr = `${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
            
            chartData.time.push(timeStr);
            chartData.count.push(count);
            chartData.rate.push(rate);

            if (chartData.time.length > chartData.maxLen) {
                chartData.time.shift();
                chartData.count.shift();
                chartData.rate.shift();
            }

            chart.setOption({
                xAxis: { data: chartData.time },
                series: [
                    { data: chartData.count },
                    { data: chartData.rate }
                ]
            });
        }

        // 蓝牙连接
        async function connectBluetooth() {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: MODULE_NAME }],
                    optionalServices: [SERVICE_UUID]
                });
                device.addEventListener('gattserverdisconnected', () => {
                    bleCharacteristic = null;
                    document.getElementById('bleStatus').textContent = '未连接';
                    document.getElementById('bleIndicator').classList.remove('connected');
                    document.getElementById('startBtn').disabled = true;
                    document.getElementById('stopBtn').disabled = true;
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(CHAR_UUID);
                await bleCharacteristic.startNotifications();
                bleCharacteristic.addEventListener('characteristicvaluechanged', onDataReceived);

                document.getElementById('bleStatus').textContent = '已连接';
                document.getElementById('bleIndicator').classList.add('connected');
                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = false;
                alert('✅ 蓝牙模块连接成功');
            } catch (e) {
                alert(`❌ 连接失败: ${e.message}`);
            }
        }

        // 发送指令
        async function send(cmd) {
            if (!bleCharacteristic) return alert('⚠️ 请先连接蓝牙模块');
            try {
                await bleCharacteristic.writeValue(new TextEncoder().encode(cmd));
                alert(`✅ 指令 ${cmd} 发送成功`);
            } catch (e) {
                alert(`❌ 发送失败: ${e.message}`);
            }
        }

        // 接收数据
        function onDataReceived(event) {
            const data = new TextDecoder().decode(event.target.value).trim();
            const [count, rate] = data.split(',').map(Number);
            if (isNaN(count) || isNaN(rate)) return;
            
            pulseNumber('totalCount', count);
            pulseNumber('successRate', rate, true);
            updateChart(count, rate);
            document.getElementById('updateTime').textContent = new Date().toLocaleTimeString();
        }

        // 自动模拟数据
        let simulateCount = 0;
        setInterval(() => {
            simulateCount += Math.floor(Math.random() * 5) + 1;
            const simulateRate = Math.floor(Math.random() * 10) + 85;
            pulseNumber('totalCount', simulateCount);
            pulseNumber('successRate', simulateRate, true);
            updateChart(simulateCount, simulateRate);
            document.getElementById('updateTime').textContent = new Date().toLocaleTimeString();
        }, 2000);
    </script>
</body>
</html>
